<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#2B2D42"/>

  <!-- ===== DOUBLED MUSIC NOTE ===== -->
  <g fill="#A78BFA">
    <!-- RIGHT note head -->
    <ellipse cx="356" cy="248" rx="42" ry="32" transform="rotate(-20 356 248)"/>
    <!-- LEFT note head — shared dot with the "?" below -->
    <ellipse cx="156" cy="248" rx="42" ry="32" transform="rotate(-20 156 248)"/>

    <!-- LEFT stem -->
    <rect x="188" y="60" width="18" height="195" rx="9"/>
    <!-- RIGHT stem -->
    <rect x="390" y="60" width="18" height="195" rx="9"/>

    <!-- Beam connecting both stems -->
    <path d="M 188 60 L 408 60 L 408 118 L 188 118 Z"/>
  </g>

  <!-- ===== INVERTED QUESTION MARK (smaller, floating below the dot) ===== -->
  <!-- Starts with a clear gap below the left note head -->
  <path d="M 156 320
           C 156 340, 156 352, 156 362
           C 156 386, 132 394, 118 408
           C 102 424, 110 446, 134 452
           C 156 458, 184 452, 196 438"
    fill="none"
    stroke="#EDF2F4"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Subtle accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96"
        fill="none" stroke="#A78BFA" stroke-opacity="0.15" stroke-width="4"/>
</svg>